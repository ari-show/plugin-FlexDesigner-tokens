name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build plugin
        run: npm run build

      - name: Validate plugin
        run: npm run plugin:validate

      - name: Pack plugin
        run: npm run plugin:pack

      - name: Rename plugin for platform
        shell: bash
        run: |
          set -euo pipefail

          # FlexDesigner expects <uuid>.<os>.<arch>.flexplugin and picks the
          # matching backend automatically at install time.
          case "${{ matrix.os }}" in
            windows-latest) OS_NAME="win32" ;;
            macos-latest)   OS_NAME="darwin" ;;
            ubuntu-latest)  OS_NAME="linux" ;;
            *) echo "::error::Unsupported OS: ${{ matrix.os }}"; exit 1 ;;
          esac

          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          SOURCE="com.arishow.aitokens.flexplugin"
          TARGET="com.arishow.aitokens.${OS_NAME}.${ARCH}.flexplugin"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::$SOURCE not found"
            ls -la
            exit 1
          fi

          mv "$SOURCE" "$TARGET"
          echo "Packed $TARGET"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.os }}-${{ runner.arch }}
          path: com.arishow.aitokens.*.*.flexplugin
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.flexplugin

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*.flexplugin
          draft: false
          prerelease: false
          generate_release_notes: true
